<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#06090d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="집중포화">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="assets/icons/favicon.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <title>집중포화 CROSSFIRE</title>
  <style>
    /* Galmuri: SIL Open Font License 1.1 (assets/fonts/OFL.md) */
    @font-face { font-family: 'Galmuri11'; src: url('assets/fonts/Galmuri11.woff2') format('woff2'); font-display: block; }
    @font-face { font-family: 'Galmuri11 Bold'; src: url('assets/fonts/Galmuri11-Bold.woff2') format('woff2'); font-display: block; }
    @font-face { font-family: 'Galmuri9'; src: url('assets/fonts/Galmuri9.woff2') format('woff2'); font-display: block; }
    html, body { margin: 0; height: 100%; background: #06090d; overflow: hidden; overscroll-behavior: none; }
    /* 모바일: 스크롤·확대·길게 눌러 선택 막기 */
    body { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
    canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; cursor: none; image-rendering: pixelated; touch-action: none; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <script type="module" src="src/main.js"></script>
  <script>
    // 홈 화면 앱 설치·오프라인용 서비스 워커 (로컬 개발 서버에서도 동작, 실패해도 게임에는 영향 없음)
    if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  </script>
</body>
</html>
